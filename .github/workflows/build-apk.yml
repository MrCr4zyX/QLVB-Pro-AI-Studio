
name: Build QLVB Mobile APK

on:
  workflow_dispatch:
    inputs:
      custom_version:
        description: 'Phiên bản tùy chọn (để trống để tự động tăng 20.3 -> 20.4 -> ... -> 20.9 -> 21.1)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Lay ma nguon
      - name: Checkout source
        uses: actions/checkout@v4

      # 1.5. Tu dong tinh phien ban moi (20.3 -> 20.4 -> ... -> 20.9 -> 21.1)
      - name: Compute Next APK Version
        id: app_version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
        run: |
          python3 - <<'VER_PY'
          import json
          import os
          import re
          import subprocess

          BASE_VERSION = (20, 3)

          def parse_ver(s: str):
              m = re.match(r'^v?(\d+)\.(\d+)$', s.strip())
              if not m:
                  return None
              return int(m.group(1)), int(m.group(2))

          custom = os.environ.get("CUSTOM_VERSION", "").strip()
          if custom:
              parsed = parse_ver(custom)
              if not parsed:
                  raise SystemExit(f"Invalid custom_version '{custom}'. Expected format like 20.4")
              major, minor = parsed
          else:
              found = [BASE_VERSION]

              # 1. Quet tat ca git tags tren remote origin
              try:
                  out = subprocess.check_output(
                      ["git", "ls-remote", "--tags", "--refs", "origin"],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  )
                  for line in out.splitlines():
                      ref = line.split("\t")[-1].replace("refs/tags/", "").strip()
                      parsed = parse_ver(ref)
                      if parsed:
                          found.append(parsed)
              except Exception:
                  pass

              # 2. Quet tat ca GitHub Releases hien co
              try:
                  out = subprocess.check_output(
                      ["gh", "release", "list", "--limit", "100", "--json", "tagName"],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  )
                  for item in json.loads(out or "[]"):
                      parsed = parse_ver(item.get("tagName", ""))
                      if parsed:
                          found.append(parsed)
              except Exception:
                  pass

              cur_major, cur_minor = max(found)
              if cur_minor >= 9:
                  major, minor = cur_major + 1, 1
              else:
                  major, minor = cur_major, cur_minor + 1

          version_name = f"{major}.{minor}"
          version_code = major * 10 + minor
          tag_name = f"v{version_name}"

          print(f"Resolved APK version: {version_name} (versionCode={version_code}, tag={tag_name})")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"version_name={version_name}\n")
              fh.write(f"version_code={version_code}\n")
              fh.write(f"tag_name={tag_name}\n")
          VER_PY

      # 2. Cai dat Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 3. Cai dat Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 4. Cai dat Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # 5. Cai dat dependencies
      - name: Install dependencies
        run: npm install

      # 6. Kiem tra Capacitor
      - name: Check Capacitor
        run: npx cap --version

      # 7. Build React (va don dep file thua truoc khi dua vao APK)
      - name: Build React app
        shell: bash
        env:
          VITE_SCAN_API_URL: ${{ secrets.VITE_SCAN_API_URL }}
        run: |
          npm run build
          rm -rf dist/*.apk dist/*.zip dist/*.idsig dist/assets/aistudio \
            dist/pwa-192x192.png dist/pwa-512x512.png dist/pwa-maskable-512x512.png \
            dist/apple-touch-icon.png dist/sw.js dist/workbox-*.js dist/sw-notification.js \
            dist/manifest.webmanifest

      # 8. Tao cau hinh Capacitor neu chua co
      - name: Configure Capacitor
        shell: bash
        run: |
          if [ ! -f capacitor.config.json ] && \
             [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.js ]; then

            cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.k02.qlvbpro",
            "appName": "QLVB PRO MOBILE",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            },
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 400,
                "launchAutoHide": true,
                "showSpinner": false,
                "backgroundColor": "#FFFFFF"
              },
              "LocalNotifications": {
                "smallIcon": "ic_stat_k02",
                "iconColor": "#1E40AF",
                "sound": "default"
              }
            }
          }
          EOF
          fi

          echo "Capacitor configuration ready"

      # 9. Tao va dong bo Android (Tu dong cap nhat version + Quyen thong bao Status Bar)
      - name: Prepare Capacitor Android
        shell: bash
        env:
          APP_VERSION_NAME: ${{ steps.app_version.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.app_version.outputs.version_code }}
        run: |
          if [ ! -f android/gradlew ]; then
            npx cap add android
          fi

          # Cap nhat version + toi uu dung luong APK: bat R8 minify + shrinkResources + giu ngon ngu vi/en + loai bo metadata thua
          python3 - <<'GRADLE_PY'
          import os
          from pathlib import Path
          import re
          import textwrap

          version_name = os.environ["APP_VERSION_NAME"]
          version_code = os.environ["APP_VERSION_CODE"]

          gradle_path = Path("android/app/build.gradle")
          if gradle_path.exists():
              text = gradle_path.read_text(encoding="utf-8")

              text = re.sub(r'versionCode\s+\d+', f'versionCode {version_code}', text, count=1)
              text = re.sub(r'versionName\s+"[^"]*"', f'versionName "{version_name}"', text, count=1)

              if "resourceConfigurations" not in text:
                  text = re.sub(
                      r'(versionName\s+"[^"]*")',
                      r'\1\n        resourceConfigurations += ["vi", "en"]',
                      text,
                      count=1,
                  )

              if "shrinkResources" not in text:
                  text = re.sub(
                      r'minifyEnabled\s+false',
                      'minifyEnabled true\n            shrinkResources true\n            signingConfig signingConfigs.debug',
                      text,
                      count=1,
                  )

              text = text.replace(
                  "getDefaultProguardFile('proguard-android.txt')",
                  "getDefaultProguardFile('proguard-android-optimize.txt')",
              )

              if "DebugProbesKt.bin" not in text:
                  text = re.sub(
                      r'(\n\s*buildTypes\s*\{)',
                      "\n    packaging {\n        resources {\n            excludes += [\n                'META-INF/LICENSE*',\n                'META-INF/NOTICE*',\n                'META-INF/*.kotlin_module',\n                'kotlin/**',\n                'DebugProbesKt.bin'\n            ]\n        }\n    }\\1",
                      text,
                      count=1,
                  )

              gradle_path.write_text(text, encoding="utf-8")
              print("Patched android/app/build.gradle for optimized R8 release APK")

              proguard_path = Path("android/app/proguard-rules.pro")
              proguard_rules = textwrap.dedent("""\
                  # Keep K02 WebView Bridge & MainActivity
                  -keep class com.k02.qlvbpro.** { *; }
                  -keepclassmembers class * {
                      @android.webkit.JavascriptInterface <methods>;
                  }

                  # Keep Capacitor core & plugins
                  -keep class com.getcapacitor.** { *; }
                  -keep class com.capacitorjs.** { *; }
                  -keep @com.getcapacitor.annotation.CapacitorPlugin class * { *; }
                  -keepclassmembers class * {
                      @com.getcapacitor.PluginMethod <methods>;
                  }
                  -keep class org.apache.cordova.** { *; }
                  -dontwarn **
              """)
              proguard_path.write_text(proguard_rules, encoding="utf-8")
              print("Wrote android/app/proguard-rules.pro")
          GRADLE_PY

          # Dam bao AndroidManifest.xml co day du quyen thong bao Status Bar & luu file Download/QLVB_PRO
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          if manifest_path.exists():
              ANDROID_NS = "http://schemas.android.com/apk/res/android"
              ET.register_namespace("android", ANDROID_NS)
              tree = ET.parse(manifest_path)
              root = tree.getroot()
              name_attr = f"{{{ANDROID_NS}}}name"
              existing = {
                  el.get(name_attr)
                  for el in root.findall("uses-permission")
              }
              required_perms = [
                  "android.permission.POST_NOTIFICATIONS",
                  "android.permission.VIBRATE",
                  "android.permission.RECEIVE_BOOT_COMPLETED",
                  "android.permission.SCHEDULE_EXACT_ALARM",
                  "android.permission.READ_EXTERNAL_STORAGE",
                  "android.permission.WRITE_EXTERNAL_STORAGE",
              ]
              for perm in required_perms:
                  if perm not in existing:
                      el = ET.SubElement(root, "uses-permission")
                      el.set(name_attr, perm)

              app_el = root.find("application")
              if app_el is not None:
                  app_el.set(f"{{{ANDROID_NS}}}requestLegacyExternalStorage", "true")
                  for act in app_el.findall("activity"):
                      has_auth_scheme = False
                      for ifilter in act.findall("intent-filter"):
                          for data_el in ifilter.findall("data"):
                              if data_el.get(f"{{{ANDROID_NS}}}scheme") == "k02qlvb":
                                  has_auth_scheme = True
                      if not has_auth_scheme:
                          ifilter = ET.SubElement(act, "intent-filter")
                          act_el = ET.SubElement(ifilter, "action")
                          act_el.set(name_attr, "android.intent.action.VIEW")
                          cat_def = ET.SubElement(ifilter, "category")
                          cat_def.set(name_attr, "android.intent.category.DEFAULT")
                          cat_brw = ET.SubElement(ifilter, "category")
                          cat_brw.set(name_attr, "android.intent.category.BROWSABLE")
                          data_el = ET.SubElement(ifilter, "data")
                          data_el.set(f"{{{ANDROID_NS}}}scheme", "k02qlvb")
                          data_el.set(f"{{{ANDROID_NS}}}host", "auth")
                          break

              tree.write(manifest_path, encoding="utf-8", xml_declaration=True)
              print("Updated AndroidManifest.xml permissions and deep-link intent-filter")

          # Tao icon thong bao monochrome cho thanh trang thai Android & bao ve tai nguyen khi bat shrinkResources
          import textwrap
          drawable_dir = Path("android/app/src/main/res/drawable")
          drawable_dir.mkdir(parents=True, exist_ok=True)
          (drawable_dir / "ic_stat_k02.xml").write_text(textwrap.dedent("""\
              <?xml version="1.0" encoding="utf-8"?>
              <vector xmlns:android="http://schemas.android.com/apk/res/android"
                  android:width="24dp"
                  android:height="24dp"
                  android:viewportWidth="24"
                  android:viewportHeight="24">
                  <path
                      android:fillColor="#FFFFFFFF"
                      android:pathData="M12,22c1.1,0 2,-0.9 2,-2h-4c0,1.1 0.9,2 2,2zM18,16v-5c0,-3.07 -1.63,-5.64 -4.5,-6.32V4c0,-0.83 -0.67,-1.5 -1.5,-1.5S10.5,3.17 10.5,4v0.68C7.64,5.36 6,7.92 6,11v5l-2,2v1h16v-1l-2,-2z"/>
              </vector>
          """), encoding="utf-8")

          raw_dir = Path("android/app/src/main/res/raw")
          raw_dir.mkdir(parents=True, exist_ok=True)
          (raw_dir / "keep.xml").write_text(textwrap.dedent("""\
              <?xml version="1.0" encoding="utf-8"?>
              <resources xmlns:tools="http://schemas.android.com/tools"
                  tools:keep="@drawable/ic_stat_k02,@drawable/k02_splash_icon,@mipmap/*" />
          """), encoding="utf-8")

          # Inject AndroidBridge into Capacitor MainActivity.java (luu file Download/QLVB_PRO + thong bao Status Bar)
          java_dir = Path("android/app/src/main/java/com/k02/qlvbpro")
          java_dir.mkdir(parents=True, exist_ok=True)
          main_activity_java = java_dir / "MainActivity.java"
          main_activity_java.write_text(textwrap.dedent("""\
              package com.k02.qlvbpro;

              import android.app.Notification;
              import android.app.NotificationChannel;
              import android.app.NotificationManager;
              import android.app.PendingIntent;
              import android.content.ContentResolver;
              import android.content.ContentValues;
              import android.content.Context;
              import android.content.Intent;
              import android.content.pm.PackageManager;
              import android.net.Uri;
              import android.os.Build;
              import android.os.Bundle;
              import android.os.Environment;
              import android.provider.MediaStore;
              import android.util.Base64;
              import android.webkit.JavascriptInterface;
              import android.webkit.WebView;
              import com.getcapacitor.BridgeActivity;
              import java.io.File;
              import java.io.FileOutputStream;
              import java.io.OutputStream;
              import java.util.concurrent.atomic.AtomicInteger;

              public class MainActivity extends BridgeActivity {
                  private static final String NOTIFICATION_CHANNEL_ID = "k02_urgent_alerts";
                  private static final String NOTIFICATION_CHANNEL_NAME = "Cảnh báo hạn báo cáo & Sao lưu!";
                  private static final AtomicInteger NEXT_NOTIFICATION_ID = new AtomicInteger(20000);
                  private String pendingAuthUri = null;

                  @Override
                  public void onCreate(Bundle savedInstanceState) {
                      super.onCreate(savedInstanceState);
                      ensureNotificationChannel();
                      captureAuthIntent(getIntent());
                      if (this.bridge != null && this.bridge.getWebView() != null) {
                          WebView webView = this.bridge.getWebView();
                          webView.addJavascriptInterface(new K02AndroidBridge(), "AndroidBridge");
                      }
                  }

                  @Override
                  protected void onNewIntent(Intent intent) {
                      super.onNewIntent(intent);
                      setIntent(intent);
                      captureAuthIntent(intent);
                  }

                  private void captureAuthIntent(Intent intent) {
                      if (intent == null) return;
                      Uri data = intent.getData();
                      if (data != null && "k02qlvb".equals(data.getScheme())) {
                          pendingAuthUri = data.toString();
                      }
                  }

                  private void ensureNotificationChannel() {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm != null) {
                              NotificationChannel channel = new NotificationChannel(
                                  NOTIFICATION_CHANNEL_ID,
                                  NOTIFICATION_CHANNEL_NAME,
                                  NotificationManager.IMPORTANCE_HIGH
                              );
                              channel.setDescription("Nhắc hạn báo cáo quan trọng và lịch sao lưu định kỳ 10:00 & 15:00 Thứ 2");
                              channel.enableVibration(true);
                              channel.enableLights(true);
                              nm.createNotificationChannel(channel);
                          }
                      }
                  }

                  public class K02AndroidBridge {
                      @JavascriptInterface
                      public boolean saveBase64File(String base64Data, String filename) {
                          try {
                              byte[] bytes = Base64.decode(base64Data, Base64.DEFAULT);
                              String cleanName = filename == null ? "export.xlsx" : filename.trim();
                              if (cleanName.startsWith("QLVB_PRO/")) {
                                  cleanName = cleanName.substring("QLVB_PRO/".length());
                              }
                              String mime = cleanName.endsWith(".json")
                                  ? "application/json"
                                  : "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";

                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                                  ContentResolver resolver = getContentResolver();
                                  ContentValues values = new ContentValues();
                                  values.put(MediaStore.MediaColumns.DISPLAY_NAME, cleanName);
                                  values.put(MediaStore.MediaColumns.MIME_TYPE, mime);
                                  values.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/QLVB_PRO");
                                  Uri uri = resolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                                  if (uri != null) {
                                      try (OutputStream out = resolver.openOutputStream(uri)) {
                                          if (out != null) {
                                              out.write(bytes);
                                              out.flush();
                                              return true;
                                          }
                                      }
                                  }
                              }

                              File downloadsDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                              File qlvbDir = new File(downloadsDir, "QLVB_PRO");
                              if (!qlvbDir.exists()) qlvbDir.mkdirs();
                              File outFile = new File(qlvbDir, cleanName);
                              try (FileOutputStream fos = new FileOutputStream(outFile)) {
                                  fos.write(bytes);
                                  fos.flush();
                                  return true;
                              }
                          } catch (Throwable t) {
                              return false;
                          }
                      }

                      @JavascriptInterface
                      public void openExternalBrowser(String url) {
                          try {
                              Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(i);
                          } catch (Exception ignored) {}
                      }

                      @JavascriptInterface
                      public boolean showNotification(String title, String body) {
                          try {
                              if (Build.VERSION.SDK_INT >= 33) {
                                  if (checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                                      return false;
                                  }
                              }
                              ensureNotificationChannel();
                              NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                              if (nm == null) return false;

                              String safeTitle = (title == null || title.trim().isEmpty()) ? "QLVB PRO" : title;
                              String safeBody = body == null ? "" : body;

                              Intent launchIntent = new Intent(MainActivity.this, MainActivity.class);
                              launchIntent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                              int piFlags = PendingIntent.FLAG_UPDATE_CURRENT;
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                  piFlags |= PendingIntent.FLAG_IMMUTABLE;
                              }
                              PendingIntent contentIntent = PendingIntent.getActivity(MainActivity.this, 0, launchIntent, piFlags);

                              int smallIcon = getResources().getIdentifier("ic_stat_k02", "drawable", getPackageName());
                              if (smallIcon == 0) {
                                  smallIcon = getApplicationInfo().icon;
                              }

                              Notification.Builder builder = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                                  ? new Notification.Builder(MainActivity.this, NOTIFICATION_CHANNEL_ID)
                                  : new Notification.Builder(MainActivity.this);

                              builder.setSmallIcon(smallIcon)
                                  .setContentTitle(safeTitle)
                                  .setContentText(safeBody)
                                  .setStyle(new Notification.BigTextStyle().bigText(safeBody))
                                  .setContentIntent(contentIntent)
                                  .setAutoCancel(true)
                                  .setDefaults(Notification.DEFAULT_ALL)
                                  .setPriority(Notification.PRIORITY_HIGH);

                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                                  builder.setColor(0xFF1E40AF);
                                  builder.setCategory(Notification.CATEGORY_REMINDER);
                              }

                              nm.notify(NEXT_NOTIFICATION_ID.incrementAndGet(), builder.build());
                              return true;
                          } catch (Throwable t) {
                              return false;
                          }
                      }

                      @JavascriptInterface
                      public boolean hasPendingAuthUri() {
                          return pendingAuthUri != null && !pendingAuthUri.isEmpty();
                      }

                      @JavascriptInterface
                      public String consumePendingAuthUri() {
                          String u = pendingAuthUri;
                          pendingAuthUri = null;
                          return u != null ? u : "";
                      }
                  }
              }
          """), encoding="utf-8")
          print("Injected K02AndroidBridge + status bar notifications into MainActivity.java")
          PY

          npx cap sync android

      # 10. Kiem tra anh nguon
      - name: Check Android Assets
        shell: bash
        run: |
          test -f assets/icon.png || {
            echo "ERROR: Missing assets/icon.png"
            exit 1
          }

          test -f assets/splash.png || {
            echo "ERROR: Missing assets/splash.png"
            exit 1
          }

          echo "K02 assets found"

      # 11. Tao tai nguyen Android
      - name: Generate Android App Assets
        shell: bash
        run: |
          npm install --no-save @capacitor/assets

          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#FFFFFF' \
            --iconBackgroundColorDark '#FFFFFF' \
            --splashBackgroundColor '#FFFFFF' \
            --splashBackgroundColorDark '#FFFFFF' || true

          echo "Android assets generated"

      # 12. Sua splash va adaptive icon Android 13
      - name: Fix Android 13 Splash And Icon
        shell: bash
        run: |
          python3 -m pip install --quiet Pillow

          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import xml.etree.ElementTree as ET

          RES = Path("android/app/src/main/res")
          SOURCE = Image.open("assets/icon.png").convert("RGBA")

          # Thay doi 2 gia tri nay neu can
          ICON_RATIO = 0.65

          def centered_logo(size, ratio):
              canvas = Image.new(
                  "RGBA",
                  (size, size),
                  (0, 0, 0, 0)
              )

              limit = round(size * ratio)

              logo = SOURCE.copy()
              logo.thumbnail(
                  (limit, limit),
                  Image.Resampling.LANCZOS
              )

              x = (size - logo.width) // 2
              y = (size - logo.height) // 2

              canvas.alpha_composite(logo, (x, y))
              return canvas

          # A. Tao icon splash rieng
          splash_path = (
              RES / "drawable-nodpi" /
              "k02_splash_icon.png"
          )

          splash_path.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          # Transparent native splash icon: Android system launch remains,
          # but it does not display the masked/rounded K02 logo.
          Image.new("RGBA", (432, 432), (0, 0, 0, 0)).save(splash_path)

          print("Created splash icon:", splash_path)

          # B. Sua foreground adaptive icon
          foreground_files = list(
              RES.glob(
                  "mipmap-*/ic_launcher_foreground.png"
              )
          )

          if not foreground_files:
              raise RuntimeError(
                  "Adaptive icon foreground not found"
              )

          for file in foreground_files:
              with Image.open(file) as original:
                  width, height = original.size

              if width != height:
                  raise RuntimeError(
                      f"Unexpected icon size: {file}"
                  )

              centered_logo(
                  width,
                  ICON_RATIO
              ).save(file)

              print("Updated foreground:", file)

          # C. Tao mau nen adaptive icon
          colors_file = RES / "values" / "colors.xml"
          colors_file.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          if colors_file.exists():
              colors_tree = ET.parse(colors_file)
              colors_root = colors_tree.getroot()
          else:
              colors_root = ET.Element("resources")
              colors_tree = ET.ElementTree(colors_root)

          color = next(
              (
                  c for c in colors_root.findall("color")
                  if c.get("name") == "k02_icon_background"
              ),
              None
          )

          if color is None:
              color = ET.SubElement(
                  colors_root,
                  "color",
                  {"name": "k02_icon_background"}
              )

          color.text = "#00000000"

          colors_tree.write(
              colors_file,
              encoding="utf-8",
              xml_declaration=True
          )

          # D. Sua adaptive icon XML
          adaptive_files = list(
              RES.glob(
                  "mipmap-anydpi*/ic_launcher*.xml"
              )
          )

          if not adaptive_files:
              raise RuntimeError(
                  "Adaptive icon XML not found"
              )

          ANDROID_NS = (
              "http://schemas.android.com/apk/res/android"
          )

          ET.register_namespace(
              "android",
              ANDROID_NS
          )

          drawable_attr = (
              "{" + ANDROID_NS + "}drawable"
          )

          for file in adaptive_files:
              tree = ET.parse(file)
              root = tree.getroot()

              background = root.find("background")
              foreground = root.find("foreground")

              if background is None or foreground is None:
                  continue

              # Xoa inset cu va cac lop long nhau
              background.clear()
              foreground.clear()

              background.set(
                  drawable_attr,
                  "@color/k02_icon_background"
              )

              foreground.set(
                  drawable_attr,
                  "@mipmap/ic_launcher_foreground"
              )

              tree.write(
                  file,
                  encoding="utf-8",
                  xml_declaration=True
              )

              print("Updated adaptive icon:", file)

          # E. Sua theme SplashScreen
          style_files = list(
              RES.glob("values*/styles.xml")
          )

          found_launch_theme = False

          for file in style_files:
              tree = ET.parse(file)
              root = tree.getroot()
              changed = False

              for style in root.findall("style"):
                  if style.get("name") != (
                      "AppTheme.NoActionBarLaunch"
                  ):
                      continue

                  found_launch_theme = True

                  # Xoa background bitmap cu
                  # va cac cau hinh splash trung lap
                  remove_names = {
                      "android:background",
                      "android:windowBackground",
                      "windowSplashScreenAnimatedIcon",
                      "windowSplashScreenBackground",
                      "postSplashScreenTheme",
                      "android:windowSplashScreenAnimatedIcon",
                      "android:windowSplashScreenBackground"
                  }

                  for item in list(style.findall("item")):
                      if item.get("name") in remove_names:
                          style.remove(item)

                  settings = {
                      "windowSplashScreenAnimatedIcon":
                          "@drawable/k02_splash_icon",
                      "windowSplashScreenBackground":
                          "#FFFFFF",
                      "postSplashScreenTheme":
                          "@style/AppTheme.NoActionBar"
                  }

                  for name, value in settings.items():
                      item = ET.SubElement(
                          style,
                          "item",
                          {"name": name}
                      )
                      item.text = value

                  changed = True

              if changed:
                  tree.write(
                      file,
                      encoding="utf-8",
                      xml_declaration=True
                  )

                  print("Updated splash theme:", file)

          # F. Toi uu dung luong tai nguyen anh: xoa cac splash PNG da do phan giai khong dung (~8-10 MB) va nen PNG icon
          removed_splash = 0
          for splash_file in list(RES.glob("drawable-*/splash.png")):
              splash_file.unlink(missing_ok=True)
              removed_splash += 1

          fallback_splash = RES / "drawable" / "splash.png"
          if fallback_splash.exists():
              Image.new("RGB", (1, 1), (255, 255, 255)).save(fallback_splash, format="PNG", optimize=True)

          compressed_icons = 0
          for icon_file in list(RES.glob("mipmap-*/ic_launcher*.png")):
              try:
                  with Image.open(icon_file) as im:
                      rgba = im.convert("RGBA")
                      quantized = rgba.quantize(colors=256, method=Image.Quantize.FASTOCTREE)
                      quantized.save(icon_file, format="PNG", optimize=True)
                      compressed_icons += 1
              except Exception as exc:
                  print("Skip icon compression:", icon_file, exc)

          print(f"K02 Android 13 resources updated (removed {removed_splash} unused splash PNGs, compressed {compressed_icons} icons)")
          PY

      # 13. Kiem tra theme va tai nguyen
      - name: Inspect Android Resources
        shell: bash
        run: |
          echo "=== Launch theme ==="
          grep -R -n \
            "windowSplashScreenAnimatedIcon\|windowSplashScreenBackground\|postSplashScreenTheme" \
            android/app/src/main/res/values* || true

          echo "=== Splash icon ==="
          find android/app/src/main/res \
            -name "k02_splash_icon.png" \
            -type f

          echo "=== Adaptive icons ==="
          find android/app/src/main/res \
            -name "ic_launcher*.xml" \
            -type f | sort

      # 14. Luu tai nguyen Android de kiem tra
      - name: Upload Android Resources
        uses: actions/upload-artifact@v4
        with:
          name: K02-Android-Resources
          path: |
            android/app/src/main/AndroidManifest.xml
            android/app/src/main/res/
          if-no-files-found: error
          retention-days: 7

      # 15. Kiem tra Gradle
      - name: Check Gradle
        shell: bash
        run: |
          test -f android/gradlew
          chmod +x android/gradlew
          if [ -n "$ANDROID_HOME" ]; then
            echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          fi

      # 16. Build Optimized Release APK (nen R8 + shrinkResources + ky debug tu dong)
      - name: Build Optimized APK
        working-directory: android
        shell: bash
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

      # 17. Doi ten APK va in dung luong
      - name: Rename APK
        shell: bash
        env:
          APP_VERSION_NAME: ${{ steps.app_version.outputs.version_name }}
        run: |
          APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_SRC" || APK_SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          APK_OUT="QLVB-PRO-v${APP_VERSION_NAME}.apk"
          cp "$APK_SRC" "$APK_OUT"
          ls -lh "$APK_OUT"

      # 18. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QLVB-PRO-v${{ steps.app_version.outputs.version_name }}-APK
          path: QLVB-PRO-v*.apk
          if-no-files-found: error
          retention-days: 30

      # 19. Phat hanh GitHub Releases
      - name: Publish APK to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION_NAME: ${{ steps.app_version.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.app_version.outputs.version_code }}
          TAG_NAME: ${{ steps.app_version.outputs.tag_name }}
        run: |
          APK_OUT="QLVB-PRO-v${APP_VERSION_NAME}.apk"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$APK_OUT" --clobber
          else
            gh release create "$TAG_NAME" \
              "$APK_OUT" \
              --title "QLVB PRO v${APP_VERSION_NAME} (Build ${GITHUB_RUN_NUMBER})" \
              --notes "APK phien ban ${APP_VERSION_NAME} (versionCode ${APP_VERSION_CODE}) tu dong dong goi bang GitHub Actions." \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
